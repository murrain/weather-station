services:
  temperature-monitor:
    command: /weather-station/startup.sh
    container_name: temperature-monitor
    devices:
      - /dev/bus/usb/001/007:/dev/bus/usb/001/007
    environment:
      - PUID=568
      - PGID=568
      - USB_DEVICE_PATH=/dev/bus/usb/001/007
      - TZ=America/Los_Angeles
    image: python:3.9-alpine
    ports:
      - '8001:8000'
    privileged: True
    volumes:
      - /mnt/ssd/apps/weather-station:/weather-station
      - /etc/localtime:/etc/localtime:ro

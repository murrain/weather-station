<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Weather</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Tinos:ital@0;1&family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet" />
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
        <link rel="stylesheet" href="styles.css" />
        <script src="https://cdn.jsdelivr.net/npm/luxon@3.4.4/build/global/luxon.min.js"></script>
    </head>
    <body>
        <div class="container">

            <!-- Narrative poem -->
            <section class="poem-section">
                <p id="weather-phrase">Loading weather data…</p>
            </section>

            <!-- Main weather display -->
            <section class="weather-section">

                <div class="condition-icon" id="weather-icon">
                    <i class="fas fa-sun icon-sun"></i>
                </div>

                <div class="primary-metrics">
                    <div class="metric-block">
                        <span class="metric-label">Temperature</span>
                        <div class="metric-value-row">
                            <span class="metric-value" id="temperature-value">--</span>
                            <span class="metric-unit" id="temperature-unit">°C</span>
                            <span class="trend-arrow" id="temp-trend">
                                <i class="fas fa-arrow-right"></i>
                            </span>
                        </div>
                        <div class="toggle-container">
                            <button class="toggle-btn active" id="celsius-btn">°C</button>
                            <button class="toggle-btn" id="fahrenheit-btn">°F</button>
                        </div>
                    </div>

                    <div class="metric-divider"></div>

                    <div class="metric-block">
                        <span class="metric-label">Humidity</span>
                        <div class="metric-value-row">
                            <span class="metric-value" id="humidity-value">--</span>
                            <span class="metric-unit">%</span>
                        </div>
                    </div>
                </div>

                <p class="feels-like">Feels like <span id="feels-like-value">--</span></p>

                <div class="condition-strip">
                    <span class="condition-item" id="condition-label">--</span>
                    <span class="condition-sep">·</span>
                    <span class="condition-item" id="wind-display">
                        <i class="fas fa-wind"></i> --
                    </span>
                    <span class="condition-sep">·</span>
                    <span class="condition-item" id="precip-display">
                        <i class="fas fa-droplet"></i> --%
                    </span>
                </div>

            </section>

            <!-- Sensor strip -->
            <section class="sensor-section">
                <div class="sensor-card" id="sensor-card-0">
                    <div class="sensor-header">
                        <span class="sensor-name">Back Porch</span>
                        <i class="fas fa-circle sensor-batt-icon offline" id="sensor-batt-0"></i>
                    </div>
                    <div class="sensor-reading">
                        <span class="sensor-temp" id="sensor-temp-0">--</span>
                        <span class="sensor-sep">·</span>
                        <span class="sensor-hum" id="sensor-hum-0">--%</span>
                    </div>
                    <div class="sensor-tooltip" id="sensor-tooltip-0"></div>
                </div>

                <div class="sensor-card" id="sensor-card-1">
                    <div class="sensor-header">
                        <span class="sensor-name">Front Porch</span>
                        <i class="fas fa-circle sensor-batt-icon offline" id="sensor-batt-1"></i>
                    </div>
                    <div class="sensor-reading">
                        <span class="sensor-temp" id="sensor-temp-1">--</span>
                        <span class="sensor-sep">·</span>
                        <span class="sensor-hum" id="sensor-hum-1">--%</span>
                    </div>
                    <div class="sensor-tooltip" id="sensor-tooltip-1"></div>
                </div>

                <div class="sensor-card" id="sensor-card-2">
                    <div class="sensor-header">
                        <span class="sensor-name">Side House</span>
                        <i class="fas fa-circle sensor-batt-icon offline" id="sensor-batt-2"></i>
                    </div>
                    <div class="sensor-reading">
                        <span class="sensor-temp" id="sensor-temp-2">--</span>
                        <span class="sensor-sep">·</span>
                        <span class="sensor-hum" id="sensor-hum-2">--%</span>
                    </div>
                    <div class="sensor-tooltip" id="sensor-tooltip-2"></div>
                </div>
            </section>

            <!-- Advanced stats -->
            <section class="stats-section">
                <div class="stats-strip">
                    <span class="stat-item">
                        <i class="fas fa-droplet"></i>
                        <span class="stat-label">Dew Pt</span>
                        <span id="stat-dewpoint">--</span>
                    </span>
                    <span class="condition-sep">·</span>
                    <span class="stat-item">
                        <i class="fas fa-gauge-high"></i>
                        <span class="stat-label">Pressure</span>
                        <span id="stat-pressure">--</span>
                    </span>
                    <span class="condition-sep">·</span>
                    <span class="stat-item">
                        <i class="fas fa-eye"></i>
                        <span class="stat-label">Vis</span>
                        <span id="stat-visibility">--</span>
                    </span>
                    <span class="condition-sep">·</span>
                    <span class="stat-item">
                        <i class="fas fa-wind"></i>
                        <span class="stat-label">Gusts</span>
                        <span id="stat-gusts">--</span>
                    </span>
                    <span class="condition-sep">·</span>
                    <span class="stat-item">
                        <i class="fas fa-leaf"></i>
                        <span class="stat-label">VPD</span>
                        <span id="stat-vpd">--</span>
                    </span>
                </div>
            </section>

            <!-- Footer -->
            <footer class="source-info">
                <div class="loading" id="loading-indicator">
                    <div class="spinner"></div>
                    <span>Loading…</span>
                </div>
                <div>
                    Updated (<span id="timezone-label">PST</span>)
                    <span id="update-time">--</span>
                </div>
            </footer>

        </div>

        <script src="config.js"></script>
        <script src="weather-narrative.js"></script>
        <script src="app.js"></script>
    </body>
</html>
